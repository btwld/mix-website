# Firebase App Hosting settings. bitwild-oss is active with billing enabled.
# The fluttermix backend and fluttermix.com domain are deployed in us-east4.
#
# App Hosting runs the package.json build script through its Next.js
# adapter, so the site-input prebuild runs inside the managed build too.
# Do not set scripts.buildCommand here: overriding it opts out of the adapter.
runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0
  maxInstances: 4

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://fluttermix.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
    availability: [BUILD, RUNTIME]
  # Environment-neutral defaults stay noindex. The production workflow adds
  # SITE_INDEXING=index and the approved SITE_COMMIT to its temporary archive.
