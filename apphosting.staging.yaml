# Select environment name "staging" on the bitwild-oss App Hosting backend.
# This is prepared configuration, not a provisioned backend or hosted release.
runConfig:
  minInstances: 0
  maxInstances: 2
env:
  - variable: SITE_INDEXING
    value: noindex
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://staging.invalid
    availability: [BUILD, RUNTIME]
