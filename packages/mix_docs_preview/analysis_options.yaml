include:
  - package:bitwild_analysis/flutter.yaml
  - package:bitwild_analysis/plugin.yaml

analyzer:
  exclude:
    - build/**
    - web/**

  # This code is shown on the website as written, in the style of Mix's own
  # docs, so keep the language checks and const rules of flutter_lints.
  language:
    strict-casts: false
    strict-inference: false
    strict-raw-types: false

linter:
  rules:
    avoid_dynamic_calls: false
    prefer_const_constructors: false
