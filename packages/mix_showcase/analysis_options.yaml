# Examples are shown beside a live view, so they are formatted narrow.
# Style code is stacked one call per line, and a chain passed as an argument
# sits inside its parentheses with each call on its own line. The formatter
# joins chains that fit, so a style file starts with `// dart format off`;
# test/source_rules_test.dart checks the layout. `trailing_commas: preserve`
# keeps hand-made splits elsewhere.
include:
  - package:bitwild_analysis/flutter.yaml
  - package:bitwild_analysis/plugin.yaml

analyzer:
  exclude:
    - build/**
    - web/**
    # Installed by the Remix CLI (see remix.yaml). Lint it in btwld/remix,
    # so local fixes don't drift from the registry.
    - lib/ui/**

  # This code is shown on the website as written, in the style of Mix's own
  # docs, so keep the language checks and const rules of flutter_lints.
  language:
    strict-casts: false
    strict-inference: false
    strict-raw-types: false
linter:
  rules:
    prefer_const_constructors: false

formatter:
  page_width: 60
  trailing_commas: preserve
