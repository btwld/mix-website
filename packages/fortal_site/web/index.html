<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fortal, a design system for Flutter built with Remix.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fortal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fortal</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The engine waits for these fonts and main() for these shaders before the
    first frame, and both builds (Wasm and JS) use them. Fetch them now,
    alongside the engine, rather than after it. Keep this list in step with
    pubspec.yaml and main.dart.
  -->
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Geist-Regular.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Geist-Medium.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Geist-SemiBold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Geist-Bold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/RobotoMono.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/packages/remix_ui_icons/lib/src/generated/fonts/RemixIcons.otf" as="fetch" crossorigin>
  <link rel="preload" href="assets/shaders/shore.frag" as="fetch" crossorigin>
  <link rel="preload" href="assets/shaders/horizon.frag" as="fetch" crossorigin>
  <link rel="preload" href="assets/shaders/dunes.frag" as="fetch" crossorigin>

  <!-- The site's green, not white, while the app loads. -->
  <style>html, body { background: #0D3D38; }</style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
