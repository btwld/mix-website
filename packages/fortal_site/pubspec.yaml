name: fortal_landing
description: "Fortal landing page: real Fortal components on a shader-drawn shore."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  mix_annotations: ">=2.2.0-beta.1 <3.0.0"
  mix_chart: ^0.0.1
  remix: ^1.0.0-rc.2
  remix_ui_icons: ^1.0.0-beta.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  analyzer: ">=14.7.0 <15.0.0"
  flutter_lints: ^6.0.0
  remix_cli: ^1.0.0-beta.1
  build_runner: ">=2.10.1 <3.0.0"
  mix_generator: ">=2.2.0-beta.3 <3.0.0"

flutter:
  uses-material-design: false
  assets:
    - assets/photos/fortaleza-beira-mar.jpg
    - assets/photos/fortaleza-beira-mar-sea.png
  shaders:
    - shaders/shore.frag
    - shaders/horizon.frag
    - shaders/dunes.frag
    - shaders/city.frag
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf

# The site follows Remix main, so a fix is visible here as soon as it merges.
# `tool/update_remix.sh` moves both this and the registry pin forward.
dependency_overrides:
  remix:
    git:
      url: https://github.com/btwld/remix.git
      path: packages/remix
      ref: main
