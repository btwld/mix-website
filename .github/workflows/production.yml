name: Deploy production
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: production-fluttermix
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.id == 1444465253 && github.repository_id == '1444465253' && github.repository_owner_id == '83911646'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PRODUCTION_DEPLOY_SERVICE_ACCOUNT }}
          project_id: bitwild-oss
          token_format: access_token
          create_credentials_file: false
      - name: Build approved source, deploy and verify public identity
        run: node scripts/deploy/production.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
