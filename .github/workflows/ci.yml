name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SITE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.5.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Verify published inputs without a cache
        run: pnpm site-inputs:remote
      - name: Unit tests (site-input pipeline)
        run: pnpm test
      # Archives are addressed by digest, so the cache can never serve a
      # different input than sources.lock.json pins.
      - uses: actions/cache@v4
        with:
          path: .site-inputs/cache
          key: site-inputs-${{ hashFiles('sources.lock.json') }}
      - name: Type check (fetches and verifies pinned site inputs)
        run: pnpm typecheck
      - run: pnpm audit:inputs
      - run: pnpm audit:inventory
      - name: Build
        run: pnpm build
      - name: Rendered route, link, anchor, image and metadata audit
        run: |
          node node_modules/next/dist/bin/next start -p 3100 > /tmp/mix-site.log 2>&1 &
          echo $! > /tmp/mix-site.pid
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3100/ >/dev/null && break || sleep 1; done
          python3 scripts/audit/rendered-site.py http://localhost:3100
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Browser checks (Chromium and WebKit)
        run: pnpm test:e2e
      - name: Stop site server before rebuilding
        run: kill "$(cat /tmp/mix-site.pid)"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Returning browser after a lock update
        env:
          FLUTTER_BIN: flutter
        run: pnpm test:lock-update chromium
      - name: Production sitemap and rendered metadata
        run: |
          SITE_INDEXING=index NEXT_PUBLIC_SITE_URL=https://fluttermix.com pnpm build
          SITE_INDEXING=index NEXT_PUBLIC_SITE_URL=https://fluttermix.com node node_modules/next/dist/bin/next start -p 3101 > /tmp/mix-production.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3101/ >/dev/null && break || sleep 1; done
          python3 scripts/audit/rendered-site.py http://localhost:3101 --indexing
      - name: Build and validate static review representation
        run: |
          pnpm build:preview
          npm install --global firebase-tools@15.34.2
          firebase emulators:exec --only hosting --project demo-mix-preview --config .generated/firebase.preview.json 'python3 scripts/audit/rendered-site.py http://localhost:5000 && E2E_BASE_URL=http://localhost:5000 pnpm test:e2e'
      - name: Upload credential-free PR preview data
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-preview-${{ github.event.pull_request.head.sha }}
          path: out/
          retention-days: 7
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results
            playwright-report
          retention-days: 14
